name: Build APK

# Builds installable APKs on every push so changes can be tested without a local Android
# toolchain. Download them from the run's "Artifacts" section.
#
# Pushing a tag like v1.1.0 (it must match versionName in app/build.gradle) also publishes the
# signed release APK as a GitHub release.
#
# Optional repository secrets give every build the SAME signature, so a new build installs over
# the previous one and keeps app data:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (KEY_PASSWORD defaults to the store password)
# Without them each build is signed with a throwaway key and must be installed after uninstalling
# the previous one.

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # only used to publish a release for tags

    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        run: |
          set -euo pipefail
          name="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle)"
          code="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle)"
          if [ -z "$name" ] || [ -z "$code" ]; then
            echo "::error::Could not read versionName/versionCode from app/build.gradle"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$name" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version v$name"
            exit 1
          fi
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make sure the Android build tools are installed
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "platforms;android-33" "build-tools;34.0.0" > /dev/null
          else
            echo "sdkmanager not found; relying on Gradle to fetch what it needs"
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # The release build shrinks code with R8; keep going if it fails so the debug APK is still
      # delivered (a tag build is stopped further down if the release APK is missing)
      - name: Build release APK
        id: release
        continue-on-error: true
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -x "$APKSIGNER"
          KS="$RUNNER_TEMP/signing.jks"

          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS"
            export STORE_PASS="$KEYSTORE_PASSWORD"
            export KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            ALIAS="$KEY_ALIAS"
            SIGNING_NOTE="your repository keystore (stable signature: builds install over each other)"
            echo "STABLE_KEY=true" >> "$GITHUB_ENV"
          else
            export STORE_PASS=android
            export KEY_PASS=android
            ALIAS=throwaway
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -storepass "$STORE_PASS" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Plus Play CI throwaway key"
            SIGNING_NOTE="a throwaway key (uninstall the previous build before installing this one)"
            echo "STABLE_KEY=false" >> "$GITHUB_ENV"
          fi

          SHA="${GITHUB_SHA::7}"
          mkdir -p dist

          sign() { # input output
            "$APKSIGNER" sign --ks "$KS" --ks-key-alias "$ALIAS" \
              --ks-pass env:STORE_PASS --key-pass env:KEY_PASS --out "$2" "$1"
            "$APKSIGNER" verify "$2"
          }

          sign app/build/outputs/apk/debug/app-debug.apk "dist/plus-play-debug-$SHA.apk"

          RELEASE_APK=app/build/outputs/apk/release/app-release-unsigned.apk
          if [ -f "$RELEASE_APK" ]; then
            sign "$RELEASE_APK" "dist/plus-play-release-$SHA.apk"
          else
            echo "::warning::The release build failed; only the debug APK is attached. See the 'Build release APK' step."
          fi

          {
            echo "### APKs"
            echo
            echo "Signed with: $SIGNING_NOTE"
            echo
            echo "| File | Size |"
            echo "|---|---|"
            for f in dist/*.apk; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: plus-play-apks-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Prepare GitHub release
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA::7}"
          if [ ! -f "dist/plus-play-release-$SHA.apk" ]; then
            echo "::error::No release APK was built, so nothing can be published"
            exit 1
          fi
          mkdir -p release
          cp "dist/plus-play-release-$SHA.apk" "release/plus-play-${VERSION_NAME}.apk"

          CHANGELOG="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          {
            echo "## What's new"
            echo
            if [ -f "$CHANGELOG" ]; then cat "$CHANGELOG"; else echo "See the commit history for changes."; fi
            echo
            echo
            echo "## Install"
            echo
            echo "Download \`plus-play-${VERSION_NAME}.apk\` below and open it on your phone (allow installing from unknown sources when asked). Needs Android 5.0 or newer; picture-in-picture needs Android 8.0 or newer."
            echo
            if [ "$STABLE_KEY" = "true" ]; then
              echo "Releases signed with the same key install over each other and keep your data."
            else
              echo "**This build is signed with a temporary key.** To install a later version you will have to uninstall this one first (saved resume positions are lost). See the README for how to switch to a stable key."
            fi
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Plus Play ${{ env.VERSION_NAME }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: release/plus-play-${{ env.VERSION_NAME }}.apk
