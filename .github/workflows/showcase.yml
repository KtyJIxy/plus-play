name: Showcase

# Starts an Android emulator on GitHub's servers, plays a generated sample video and records
# screenshots and a short screen video of the app. Run it by hand from the Actions tab
# (Showcase, Run workflow); the files are in the run's Artifacts. Nothing from a personal phone
# or library is shown.

on:
  workflow_dispatch:
  push:
    branches: [showcase]
    paths:
      - .github/workflows/showcase.yml
      - .github/showcase/**

jobs:
  showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build debug APK
        run: .github/scripts/run-gradle.sh "Debug build" assembleDebug --stacktrace

      - name: Generate sample video
        run: |
          ffmpeg -loglevel error -f lavfi -i "testsrc2=size=1280x720:rate=30" \
            -f lavfi -i "sine=frequency=330:sample_rate=44100" -t 45 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest .github/showcase/sample.mp4
          ls -la .github/showcase

      - name: Allow hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Record the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/showcase/run.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload screenshots and video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-${{ github.run_number }}
          path: showcase-out/*
          retention-days: 30
          if-no-files-found: warn
